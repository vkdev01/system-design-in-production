; Chapter 02: transaction pooling in front of a sharded Postgres fleet.
; Server connections per database stay small; client connections are cheap.
[databases]
notion_db_00 = host=notion-db-00.abc123.ap-south-1.rds.amazonaws.com dbname=notion
notion_db_01 = host=notion-db-01.abc123.ap-south-1.rds.amazonaws.com dbname=notion
notion_db_02 = host=notion-db-02.abc123.ap-south-1.rds.amazonaws.com dbname=notion

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 60
query_wait_timeout = 10
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
stats_period = 60
