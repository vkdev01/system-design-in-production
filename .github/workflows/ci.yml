name: Site and content checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - name: Build the site
        run: python site_builder/build.py
      - name: Check every diagram renders
        run: python site_builder/check_diagrams.py dist
      - name: Every markdown page is reachable from the nav
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'site_builder')
          import build
          listed = {p['src'] for s in build.SECTIONS for p in s['pages']}
          on_disk = {str(p.relative_to(build.DOCS)) for p in build.DOCS.rglob('*.md')}
          orphan = on_disk - listed - {'index.md'}
          print('pages in nav:', len(listed), '| markdown files:', len(on_disk))
          if orphan:
              print('NOT IN NAV:', sorted(orphan)); sys.exit(1)
          PY
      - name: Validate YAML manifests
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          files = glob.glob("deploy/**/*.yaml", recursive=True) + glob.glob("deploy/**/*.yml", recursive=True)
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f)))
              except Exception as e:
                  bad.append((f, e))
          print(f"checked {len(files)} files, {len(bad)} errors")
          for f, e in bad:
              print("FAIL", f, e)
          sys.exit(1 if bad else 0)
          PY
