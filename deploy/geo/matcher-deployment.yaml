# Chapter 08: the matcher, sharded by city.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
  namespace: geo
spec:
  replicas: 9
  selector:
    matchLabels: { app: matcher }
  template:
    metadata:
      labels: { app: matcher }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: matcher
          image: ghcr.io/example/matcher:1.9.3
          args:
            - --city=ap-south-1
            - --ring-expansion=1,2,3,5
            - --max-candidates=40
            - --offer-ttl=12s
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9090, name: metrics }
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: geo-redis, key: url }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: geo-pg, key: url }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 2Gi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matcher
  namespace: geo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matcher
  minReplicas: 9
  maxReplicas: 36
  metrics:
    - type: Pods
      pods:
        metric: { name: match_duration_seconds_p99 }
        target: { type: AverageValue, averageValue: "50m" }
