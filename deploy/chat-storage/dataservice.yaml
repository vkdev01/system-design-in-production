# Chapter 01: the coalescing data service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-dataservice
  namespace: chat
spec:
  replicas: 6
  selector:
    matchLabels: { app: message-dataservice }
  template:
    metadata:
      labels: { app: message-dataservice }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: message-dataservice }
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: ghcr.io/example/message-dataservice:1.4.2
          args: ["--max-concurrent-per-shard=8", "--query-timeout=250ms"]
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9090, name: metrics }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 10
            failureThreshold: 6
          env:
            - name: SCYLLA_HOSTS
              value: messages-client.chat.svc.cluster.local
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: message-dataservice
  namespace: chat
spec:
  minAvailable: 5
  selector:
    matchLabels: { app: message-dataservice }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: message-dataservice
  namespace: chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: message-dataservice
  minReplicas: 6
  maxReplicas: 24
  metrics:
    - type: Pods
      pods:
        metric: { name: coalescer_inflight_queries }
        target: { type: AverageValue, averageValue: "6" }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
