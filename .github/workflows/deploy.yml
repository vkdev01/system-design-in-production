name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Build
        env:
          # project page lives under /system-design-in-production/
          SITE_BASE: /system-design-in-production
        run: python site_builder/build.py
      - name: Check the build produced pages
        run: |
          test -f dist/index.html
          test -f dist/chapters/01-chat-message-storage/index.html
          test -f dist/search-index.json
          test -f dist/.nojekyll
          echo "pages: $(find dist -name '*.html' | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
