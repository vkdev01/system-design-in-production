site_name: System Design in Production
site_description: Nine real production systems rebuilt from first principles - numbers, mental models, flow charts, runnable code and the Kubernetes/AWS configs that actually run them.
site_url: https://vkdev01.github.io/system-design-in-production/
repo_url: https://github.com/vkdev01/system-design-in-production
repo_name: vkdev01/system-design-in-production
edit_uri: edit/main/docs/
copyright: Built as a study and reference manual. Every number is sourced from the linked engineering write-up.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - content.tooltips
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  font: false          # system font stack: faster, and no third-party request
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Start here: index.md
  - Foundations:
      - The 9 mental models: foundations/mental-models.md
      - Numbers you must know: foundations/numbers.md
      - The 7-step method: foundations/method.md
  - Part I - Storing and scaling data:
      - "01 Chat message storage (Discord)": chapters/01-chat-message-storage.md
      - "02 Sharding Postgres (Notion)": chapters/02-sharding-postgres.md
      - "03 Scaling Postgres without rewriting the app (Figma)": chapters/03-scaling-postgres-figma.md
  - Part II - Money and APIs:
      - "04 Idempotent payment APIs (Stripe)": chapters/04-idempotent-payment-api.md
      - "05 Stopping double payments (Airbnb)": chapters/05-double-payment-prevention.md
      - "06 Rate limiting and load shedding (Stripe)": chapters/06-rate-limiting.md
  - Part III - Realtime, geo and fan-out:
      - "07 Realtime messaging (Slack)": chapters/07-realtime-messaging.md
      - "08 Geospatial matching (Uber H3)": chapters/08-geospatial-matching.md
      - "09 Notification fan-out (Discord push)": chapters/09-notification-fanout.md
  - Appendices:
      - A - Kubernetes and AWS patterns: appendices/k8s-aws-patterns.md
      - B - Failure drills and interview scripts: appendices/drills.md
      - C - Sources: appendices/sources.md

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vkdev01
