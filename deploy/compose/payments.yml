# Chapter 05 on a laptop: Postgres + the repair worker.
#   docker compose -f deploy/compose/payments.yml up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: payments
    ports: ["5432:5432"]
    volumes:
      - ../../code/payments-outbox/migrations/001.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  repair:
    build:
      context: ../../code/payments-outbox
    command: ["python", "repair.py"]
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/payments
    depends_on:
      postgres:
        condition: service_healthy
