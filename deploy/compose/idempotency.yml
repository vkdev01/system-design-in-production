# Chapter 04 on a laptop: Postgres + the idempotent payments API.
#   docker compose -f deploy/compose/idempotency.yml up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: payments
    ports: ["5432:5432"]
    volumes:
      - ../../code/idempotency/migrations/001_keys.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../code/idempotency
    environment:
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/payments
      IDEMPOTENCY_LEASE_SECONDS: "30"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  reaper:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do psql postgresql://postgres:dev@postgres:5432/payments -f /reap.sql; sleep 60; done"
    volumes:
      - ../../code/idempotency/reap.sql:/reap.sql:ro
