apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-publisher
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels: { app: outbox-publisher }
  template:
    metadata:
      labels: { app: outbox-publisher }
    spec:
      containers:
        - name: pub
          image: ghcr.io/example/payments-worker:3.1.0
          args: ["outbox", "--batch=500", "--max-in-flight=50"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: payments-db, key: primary-url }
            - { name: PUBLISH_TARGET, value: "sqs://payments-settled" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 512Mi }
