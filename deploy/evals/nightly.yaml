# Chapter 13: the nightly eval, and the gate CI runs on pull requests.
apiVersion: batch/v1
kind: CronJob
metadata: { name: evals-nightly, namespace: evals }
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: evals
              image: ghcr.io/example/evals:1.4.0
              args: ["--dataset=v7", "--concurrency=50", "--max-cost-usd=250"]
              env:
                - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: evals-db, key: url } } }
              resources:
                requests: { cpu: "2", memory: 2Gi }
                limits: { memory: 4Gi }
